version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: kd-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - MONGO_URI=mongodb://mongo:27017/knowledge_discovery
    depends_on:
      - neo4j
      - mongo

  neo4j:
    image: neo4j:5
    container_name: kd-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data

  mongo:
    image: mongo:7.0
    container_name: kd-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=knowledge_discovery
    volumes:
      - mongo_data:/data/db

volumes:
  neo4j_data:
  mongo_data:
